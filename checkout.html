<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Turath</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 style="margin-top:1.5rem">Checkout</h1>
    <div class="two-col">
      <form id="checkout-form" class="form-card wide" style="margin:0;max-width:none" novalidate>
        <h2>Delivery details</h2>
        <div class="row two">
          <div><label for="shipping_name">Receiver's name *</label><input id="shipping_name" maxlength="80" required></div>
          <div><label for="shipping_phone">UAE mobile *</label><input id="shipping_phone" type="tel" placeholder="0501234567" required></div>
        </div>
        <label for="shipping_address">Address (building, street, area) *</label>
        <textarea id="shipping_address" maxlength="250" placeholder="Villa / building, street, area" required></textarea>
        <label for="emirate">Emirate</label>
        <select id="emirate"></select>
        <h2 style="margin-top:1.5rem">Payment</h2>
        <div class="pay-card"><strong>✔ Cash on delivery</strong><span class="muted small">Pay when your order arrives. Delivery is free, usually 2–5 working days.</span></div>
        <p class="field-hint">This is a student project, so no real payment is taken and no card details are collected.</p>
        <div id="form-msg" class="msg" hidden role="alert"></div>
        <p><button class="btn btn-block" type="submit" id="place-order">Place order</button></p>
        <p><a href="cart.html">← Back to cart</a></p>
      </form>
      <aside class="summary">
        <h3>Your items</h3>
        <div id="co-items"></div>
        <div id="co-summary" style="margin-top:.8rem"></div>
      </aside>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/dist/umd/supabase.js" integrity="sha384-2DeuFKyqIlpZfFmj+jl/+IbM3DwDM4vGKsvK0fI32E0ZDt24W33hB6pka4RAdbz2" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
