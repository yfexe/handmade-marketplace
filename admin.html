<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Turath</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container" id="admin-root">
    <h1 style="margin-top:1.5rem">Shop management</h1>
    <div id="admin-content" hidden>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="dashboard">Analytics dashboard</button>
        <button class="tab" data-tab="products">Products</button>
        <button class="tab" data-tab="orders">Orders</button>
      </div>

      <section id="tab-dashboard">
        <div class="stat-grid" id="stat-grid"></div>
        <div class="chart-grid">
          <div class="chart-box"><h3>Sales per day (last 30 days)</h3><canvas id="chart-day"></canvas></div>
          <div class="chart-box"><h3>Revenue by category</h3><canvas id="chart-cat"></canvas></div>
          <div class="chart-box"><h3>Most popular products (units sold)</h3><canvas id="chart-top"></canvas></div>
          <div class="chart-box"><h3>Low stock (5 or fewer)</h3>
            <div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th></tr></thead><tbody id="low-stock"></tbody></table></div></div>
        </div>
      </section>

      <section id="tab-products" hidden>
        <div class="table-wrap"><table>
          <thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
          <tbody id="product-rows"></tbody></table></div>
        <form id="product-form" class="form-card wide" style="margin-left:0" novalidate>
          <h2 id="pf-title">Add a product</h2>
          <div class="row two">
            <div><label for="pf-name">Name</label><input id="pf-name" maxlength="120" required></div>
            <div><label for="pf-category">Category</label><select id="pf-category"></select></div>
            <div><label for="pf-price">Price (AED, before VAT)</label><input id="pf-price" type="number" min="0" step="0.01" required></div>
            <div><label for="pf-stock">Stock</label><input id="pf-stock" type="number" min="0" step="1" required></div>
            <div><label for="pf-artisan">Artisan</label><input id="pf-artisan" maxlength="80" required></div>
            <div><label for="pf-image">Image (e.g. images/p01.svg)</label><input id="pf-image" placeholder="images/placeholder.svg"></div>
          </div>
          <label for="pf-desc">Description</label><textarea id="pf-desc" maxlength="600"></textarea>
          <label>Occasions (for the Gift Finder)</label><div id="pf-occasions"></div>
          <div id="pf-msg" class="msg" hidden role="alert"></div>
          <p><button class="btn" type="submit" id="pf-submit">Add product</button> <button class="btn btn-light" type="button" id="pf-cancel" hidden>Cancel edit</button></p>
        </form>
      </section>

      <section id="tab-orders" hidden>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="order-rows"></tbody></table></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
