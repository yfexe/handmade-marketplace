<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Turath</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <form class="form-card" id="login-form" novalidate>
      <h1>Log in</h1>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="form-msg" class="msg" hidden role="alert"></div>
      <p><button class="btn" type="submit">Log in</button></p>
      <p class="muted small">New here? <a href="register.html" data-keep-next>Create an account</a></p>
    </form>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
