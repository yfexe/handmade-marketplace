<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account | Turath</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 style="margin-top:1.5rem">My account</h1>
    <div class="two-col">
      <section>
        <h2>My orders</h2>
        <div id="orders-list"></div>
      </section>
      <form class="summary" id="profile-form" novalidate>
        <h3>My details</h3>
        <label for="p-name">Full name</label><input id="p-name" maxlength="80" required>
        <label for="p-email">E-mail</label><input id="p-email" disabled>
        <label for="p-phone">UAE mobile</label><input id="p-phone" type="tel" placeholder="0501234567">
        <label for="p-address">Delivery address</label><textarea id="p-address" maxlength="250"></textarea>
        <div id="profile-msg" class="msg" hidden role="alert"></div>
        <p><button class="btn" type="submit">Save details</button></p>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/dist/umd/supabase.js" integrity="sha384-2DeuFKyqIlpZfFmj+jl/+IbM3DwDM4vGKsvK0fI32E0ZDt24W33hB6pka4RAdbz2" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
